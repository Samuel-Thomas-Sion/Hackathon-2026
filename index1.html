<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🕵️ DocSleuth — AI Fine-Print Scanner</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --card: #273549;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --high: #ef4444;
      --med: #f59e0b;
      --low: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

    /* Non-scrollable fixed sidebar */
    aside {
      width: 300px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow: hidden;
    }

    aside h1 { font-size: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
    aside p.tagline { color: var(--muted); font-size: 0.88rem; margin-top: -0.6rem; }

    label { font-size: 0.82rem; font-weight: 600; color: var(--muted); display: block; margin-bottom: 0.35rem; }

    input[type="password"], select, textarea {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.75rem;
      font-size: 0.92rem;
      outline: none;
    }

    /* Pointer cursor on the entire Analysis Lens wrapper */
    .lens-wrapper, .lens-wrapper * {
      cursor: pointer !important;
    }

    select:focus, input:focus, textarea:focus { border-color: var(--accent); }

    .privacy-badge {
      margin-top: auto;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 8px;
      padding: 0.75rem;
      font-size: 0.8rem;
      color: #bae6fd;
      line-height: 1.4;
    }

    /* Main workspace */
    main {
      flex: 1;
      padding: 2rem;
      max-width: 960px;
      margin: 0 auto;
    }

    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .tab-btn {
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.55rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .tab-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }

    .dropzone {
      border: 2px dashed var(--border);
      background: var(--panel);
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .dropzone:hover { border-color: var(--accent); }
    .dropzone input { display: none; }

    button.scan-btn {
      margin-top: 1rem;
      width: 100%;
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 0.85rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button.scan-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Results */
    #results { margin-top: 2rem; display: none; flex-direction: column; gap: 1.25rem; }

    .score-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .score-num { font-size: 2.5rem; font-weight: 800; }

    .flag-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-left: 5px solid var(--med);
      border-radius: 10px;
      padding: 1.1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .flag-card.High { border-left-color: var(--high); }
    .flag-card.Medium { border-left-color: var(--med); }
    .flag-card.Low { border-left-color: var(--low); }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      text-transform: uppercase;
    }
    .badge.High { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .badge.Medium { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }
    .badge.Low { background: rgba(34, 197, 94, 0.2); color: #86efac; }

    blockquote {
      background: var(--bg);
      border-left: 3px solid var(--muted);
      padding: 0.5rem 0.75rem;
      font-size: 0.85rem;
      color: #cbd5e1;
      border-radius: 4px;
    }

    .worst-case { font-size: 0.88rem; color: #fda4af; }
    .pushback-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.1rem;
    }
    .pushback-box pre {
      white-space: pre-wrap;
      background: var(--bg);
      padding: 0.85rem;
      border-radius: 8px;
      font-size: 0.88rem;
      margin-top: 0.5rem;
      color: #e2e8f0;
    }
    .error-banner {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--high);
      color: #fecaca;
      padding: 0.9rem;
      border-radius: 8px;
      margin-top: 1rem;
      display: none;
    }
  </style>
</head>
<body>

  <aside>
    <h1>🕵️ DocSleuth</h1>
    <p class="tagline">Spot hidden traps before you agree.</p>

    <div>
      <label for="apiKey">Gemini API Key</label>
      <input type="password" id="apiKey" placeholder="AIzaSy..." />
    </div>

    <div class="lens-wrapper">
      <label for="lens">Analysis Lens</label>
      <select id="lens">
        <option value="General Consumer & Student">General Consumer & Student</option>
        <option value="App Terms & Privacy Policy">App Terms & Privacy Policy</option>
        <option value="Rental / Lease Agreement">Rental / Lease Agreement</option>
        <option value="Employment / Internship Offer">Employment / Internship Offer</option>
      </select>
    </div>

    <div class="privacy-badge">
      🔒 <strong>Zero Storage:</strong> Your documents are sent directly to Gemini from your browser and are never saved on any server.
    </div>
  </aside>

  <main>
    <div class="tabs">
      <button class="tab-btn active" id="tabTextBtn">Paste Fine Print</button>
      <button class="tab-btn" id="tabFileBtn">Upload PDF / Screenshot</button>
    </div>

    <div id="textInputPane">
      <textarea id="contractText" rows="9" placeholder="Paste suspicious Terms & Conditions, rental clauses, app permissions, or offer letter text here..."></textarea>
    </div>

    <div id="fileInputPane" style="display: none;">
      <label class="dropzone" for="fileUpload">
        <div id="fileLabel">📄 Click to upload a <strong>PDF, PNG, or JPG</strong> screenshot</div>
        <input type="file" id="fileUpload" accept=".pdf,image/png,image/jpeg,image/webp" />
      </label>
    </div>

    <button class="scan-btn" id="scanBtn">🔍 Scan for Hidden Traps</button>
    <div class="error-banner" id="errorBanner"></div>

    <div id="results"></div>
  </main>

  <script type="module">
    import { GoogleGenAI, Type } from "https://esm.run/@google/genai";

    // Elements
    const apiKeyInput = document.getElementById("apiKey");
    const lensSelect = document.getElementById("lens");
    const tabTextBtn = document.getElementById("tabTextBtn");
    const tabFileBtn = document.getElementById("tabFileBtn");
    const textInputPane = document.getElementById("textInputPane");
    const fileInputPane = document.getElementById("fileInputPane");
    const contractText = document.getElementById("contractText");
    const fileUpload = document.getElementById("fileUpload");
    const fileLabel = document.getElementById("fileLabel");
    const scanBtn = document.getElementById("scanBtn");
    const errorBanner = document.getElementById("errorBanner");
    const resultsDiv = document.getElementById("results");

    let activeMode = "text";
    let uploadedFilePart = null;

    // Remember API key locally in this browser only
    const savedKey = localStorage.getItem("docsleuth_gemini_key");
    if (savedKey) apiKeyInput.value = savedKey;
    apiKeyInput.addEventListener("input", () => {
      localStorage.setItem("docsleuth_gemini_key", apiKeyInput.value.trim());
    });

    // Tab switching
    tabTextBtn.addEventListener("click", () => {
      activeMode = "text";
      tabTextBtn.classList.add("active");
      tabFileBtn.classList.remove("active");
      textInputPane.style.display = "block";
      fileInputPane.style.display = "none";
    });

    tabFileBtn.addEventListener("click", () => {
      activeMode = "file";
      tabFileBtn.classList.add("active");
      tabTextBtn.classList.remove("active");
      fileInputPane.style.display = "block";
      textInputPane.style.display = "none";
    });

    // Convert uploaded PDF/Image into Gemini inlineData base64 part
    fileUpload.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      fileLabel.innerHTML = `✅ Selected: <strong>${file.name}</strong> (${(file.size / 1024).toFixed(1)} KB)`;

      const reader = new FileReader();
      reader.onload = () => {
        const base64Data = reader.result.split(",")[1];
        uploadedFilePart = {
          inlineData: {
            data: base64Data,
            mimeType: file.type || "application/pdf",
          },
        };
      };
      reader.readAsDataURL(file);
    });

    // Structured Output Schema
    const auditSchema = {
      type: Type.OBJECT,
      properties: {
        safety_score: {
          type: Type.INTEGER,
          description: "Safety trust score from 0 (predatory trap) to 100 (completely fair).",
        },
        verdict: {
          type: Type.STRING,
          description: "One-sentence blunt verdict for the user.",
        },
        red_flags: {
          type: Type.ARRAY,
          items: {
            type: Type.OBJECT,
            properties: {
              title: { type: Type.STRING },
              severity: { type: Type.STRING, enum: ["High", "Medium", "Low"] },
              quote: { type: Type.STRING, description: "Exact risky clause from the document." },
              plain_english: { type: Type.STRING, description: "Simple explanation of the trap." },
              worst_case: { type: Type.STRING, description: "Concrete financial or privacy consequence." },
            },
            required: ["title", "severity", "quote", "plain_english", "worst_case"],
          },
        },
        fair_clauses: {
          type: Type.ARRAY,
          items: { type: Type.STRING },
          description: "Standard or consumer-friendly clauses found in the text.",
        },
        pushback_reply: {
          type: Type.STRING,
          description: "Polite, firm message the user can send to negotiate or reject the red flags.",
        },
      },
      required: ["safety_score", "verdict", "red_flags", "fair_clauses", "pushback_reply"],
    };

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.style.display = "block";
    }

    function renderResults(data) {
      const scoreColor =
        data.safety_score >= 75 ? "var(--low)" : data.safety_score >= 45 ? "var(--med)" : "var(--high)";

      const flagsHtml = data.red_flags.length
        ? data.red_flags
            .map(
              (flag) => `
          <div class="flag-card ${flag.severity}">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <strong>${flag.title}</strong>
              <span class="badge ${flag.severity}">${flag.severity} Risk</span>
            </div>
            <blockquote>"${flag.quote}"</blockquote>
            <p>${flag.plain_english}</p>
            <p class="worst-case">⚠️ <strong>Worst-Case Impact:</strong> ${flag.worst_case}</p>
          </div>`
            )
            .join("")
        : `<div class="flag-card Low"><strong>No major traps detected!</strong></div>`;

      const fairHtml = data.fair_clauses.length
        ? `<div class="pushback-box">
            <strong>✅ Fair / Standard Terms Detected</strong>
            <ul style="margin-top:0.5rem; padding-left:1.25rem; color:#cbd5e1; line-height:1.6;">
              ${data.fair_clauses.map((c) => `<li>${c}</li>`).join("")}
            </ul>
          </div>`
        : "";

      resultsDiv.innerHTML = `
        <div class="score-card">
          <div>
            <div style="font-size:0.8rem; color:var(--muted); text-transform:uppercase; font-weight:700;">Safety Trust Score</div>
            <p style="margin-top:0.35rem; font-size:1.05rem;">${data.verdict}</p>
          </div>
          <div class="score-num" style="color:${scoreColor};">${data.safety_score}/100</div>
        </div>
        ${flagsHtml}
        ${fairHtml}
        <div class="pushback-box">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong>✉️ Ready-to-Send Pushback Reply</strong>
            <button id="copyReplyBtn" style="background:var(--accent); color:#0f172a; border:none; padding:0.35rem 0.75rem; border-radius:6px; font-weight:700; cursor:pointer;">Copy Message</button>
          </div>
          <pre id="replyText">${data.pushback_reply}</pre>
        </div>
      `;

      resultsDiv.style.display = "flex";

      document.getElementById("copyReplyBtn").addEventListener("click", () => {
        navigator.clipboard.writeText(data.pushback_reply);
        document.getElementById("copyReplyBtn").textContent = "Copied!";
      });
    }

    scanBtn.addEventListener("click", async () => {
      errorBanner.style.display = "none";
      resultsDiv.style.display = "none";

      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        return showError("Please enter your Gemini API Key in the sidebar first.");
      }

      const lens = lensSelect.value;
      const prompt = `You are DocSleuth, an expert consumer-protection fine-print scanner. Analyze this document strictly through the "${lens}" perspective. Identify hidden financial traps, auto-renewals, deposit forfeitures, invasive privacy clauses, and unfair terms. Be concrete and blunt.`;

      const contents = [];
      if (activeMode === "text") {
        const text = contractText.value.trim();
        if (!text) return showError("Please paste some text to scan.");
        contents.push(`${prompt}\n\nDOCUMENT TEXT:\n${text}`);
      } else {
        if (!uploadedFilePart) return showError("Please upload a PDF or image screenshot first.");
        contents.push(uploadedFilePart, prompt);
      }

      scanBtn.disabled = true;
      scanBtn.textContent = "⏳ Scanning document...";

      try {
        const ai = new GoogleGenAI({ apiKey });
        const response = await ai.models.generateContent({
          model: "gemini-2.5-flash",
          contents,
          config: {
            responseMimeType: "application/json",
            responseSchema: auditSchema,
            temperature: 0.2,
          },
        });

        const parsed = JSON.parse(response.text);
        renderResults(parsed);
      } catch (err) {
        showError(`Scan failed: ${err.message || err}`);
      } finally {
        scanBtn.disabled = false;
        scanBtn.textContent = "🔍 Scan for Hidden Traps";
      }
    });
  </script>
</body>
</html>
